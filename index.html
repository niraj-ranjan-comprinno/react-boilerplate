<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Atomic Boilerplate</title>
    <!-- Default to dark — matches the public Vorflux visual direction.
         User can switch via the UserMenu theme toggle.
         No-flash: reads persisted preference before first paint. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          if (s === "light") {
            // explicit light preference — honour it
          } else {
            // dark by default (no pref, "dark", or "system" on dark OS)
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
